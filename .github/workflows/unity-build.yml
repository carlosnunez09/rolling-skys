name: Unity Build

on:
  push:
    branches:
      - networking-branch
    tags:
      - v*
    paths:
      - .github/workflows/unity-build.yml
      - Assets/**
      - Packages/**
      - ProjectSettings/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unity-build.yml
      - Assets/**
      - Packages/**
      - ProjectSettings/**
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Client
            targetPlatform: StandaloneWindows64
            buildName: rolling-skys-windows
            artifactName: rolling-skys-windows-exe
            customParameters: ""
          - name: Linux Server
            targetPlatform: StandaloneLinux64
            buildName: rolling-skys-linux-server
            artifactName: rolling-skys-linux-server
            customParameters: -standaloneBuildSubtarget Server

    env:
      BUILD_TARGET: ${{ matrix.targetPlatform }}
      ZIP_NAME: ${{ matrix.artifactName }}-${{ github.sha }}.zip

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.name }}-${{ env.BUILD_TARGET }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.name }}-${{ env.BUILD_TARGET }}-
            Library-${{ runner.os }}-

      - name: Stamp Unity version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $projectSettingsPath = "ProjectSettings/ProjectSettings.asset"
          $settings = Get-Content -Raw -Path $projectSettingsPath
          $settings = $settings -replace 'bundleVersion: .+', "bundleVersion: $version"
          Set-Content -Path $projectSettingsPath -Value $settings -NoNewline

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: ${{ env.BUILD_TARGET }}
          buildName: ${{ matrix.buildName }}
          buildsPath: build
          customParameters: ${{ matrix.customParameters }}

      - name: Package release file
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "build/*" -DestinationPath "release/$env:ZIP_NAME" -Force

      - name: Upload release file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: release/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
