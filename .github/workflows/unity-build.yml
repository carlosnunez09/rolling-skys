name: Unity Build

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unity-build.yml
      - Assets/**
      - Packages/**
      - ProjectSettings/**
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Client
            targetPlatform: StandaloneWindows64
            buildName: rolling-skys-windows
            artifactName: rolling-skys-windows-exe
            customParameters: ""
            runner: ubuntu-latest
          - name: Linux Server
            targetPlatform: StandaloneLinux64
            buildName: rolling-skys-linux-server
            artifactName: rolling-skys-linux-server
            customParameters: -standaloneBuildSubtarget Server
            runner: self-hosted

    env:
      BUILD_TARGET: ${{ matrix.targetPlatform }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.name }}-${{ env.BUILD_TARGET }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.name }}-${{ env.BUILD_TARGET }}-
            Library-${{ runner.os }}-

      - name: Verify runner tools are available
        shell: bash
        run: |
          command -v docker
          command -v python3
          docker version
          docker info

      - name: Stamp Unity version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          path = pathlib.Path("ProjectSettings/ProjectSettings.asset")
          text = path.read_text()
          text = re.sub(r"bundleVersion: .+", f"bundleVersion: {version}", text)
          path.write_text(text)
          PY

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: ${{ env.BUILD_TARGET }}
          buildName: ${{ matrix.buildName }}
          buildsPath: build
          versioning: None
          customParameters: ${{ matrix.customParameters }}

      - name: Choose package name
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            suffix="$GITHUB_REF_NAME"
          else
            suffix="${GITHUB_SHA::7}"
          fi

          echo "ZIP_NAME=${{ matrix.artifactName }}-$suffix.zip" >> "$GITHUB_ENV"

      - name: Package release file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          build_dir = pathlib.Path("build")
          zip_path = pathlib.Path("release") / os.environ["ZIP_NAME"]
          zip_path.parent.mkdir(parents=True, exist_ok=True)

          files = [path for path in build_dir.rglob("*") if path.is_file()]
          if not files:
            raise SystemExit("No build files found to package.")

          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as archive:
            for path in files:
              archive.write(path, path.relative_to(build_dir))

          print(f"Packaged {len(files)} files into {zip_path}")
          PY

      - name: Upload release file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: release/*.zip
          if-no-files-found: error

      - name: Fix permissions for runner cleanup
        if: always() && matrix.runner == 'self-hosted'
        shell: bash
        run: docker run --rm -v /home/carlos/actions-runner/_work:/work alpine chown -R $(id -u):$(id -g) /work

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          body: |
            Download one of the build zip files below.

            - Windows client: `rolling-skys-windows-exe-${{ github.ref_name }}.zip`
            - Linux server: `rolling-skys-linux-server-${{ github.ref_name }}.zip`

            GitHub also shows automatic "Source code" archives on every release. Those are not the playable game builds.

  deploy:
    name: Deploy Dev Server
    runs-on: self-hosted
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout project (for deploy script + Dockerfile)
        uses: actions/checkout@v4

      - name: Deploy server from CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/deploy-server.sh
          ./scripts/deploy-server.sh
