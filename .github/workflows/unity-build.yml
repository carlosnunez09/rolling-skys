name: Unity Build

on:
  push:
    branches:
      - networking-branch
    paths:
      - .github/workflows/unity-build.yml
      - Assets/**
      - Packages/**
      - ProjectSettings/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/unity-build.yml
      - Assets/**
      - Packages/**
      - ProjectSettings/**
  workflow_dispatch:

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Client
            targetPlatform: StandaloneWindows64
            buildName: rolling-skys-windows
            artifactName: rolling-skys-windows-exe
            customParameters: ""
          - name: Linux Server
            targetPlatform: StandaloneLinux64
            buildName: rolling-skys-linux-server
            artifactName: rolling-skys-linux-server
            customParameters: -standaloneBuildSubtarget Server

    env:
      BUILD_TARGET: ${{ matrix.targetPlatform }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.name }}-${{ env.BUILD_TARGET }}-${{ hashFiles('ProjectSettings/ProjectVersion.txt', 'Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.name }}-${{ env.BUILD_TARGET }}-
            Library-${{ runner.os }}-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: auto
          targetPlatform: ${{ env.BUILD_TARGET }}
          buildName: ${{ matrix.buildName }}
          buildsPath: build
          customParameters: ${{ matrix.customParameters }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: build
          if-no-files-found: error
